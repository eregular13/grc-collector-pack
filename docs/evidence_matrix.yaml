# Assessment lane → pack in/<lane>/.
# Names align with evergreen-covey docs/evidence_matrix.yaml (sibling; do not block).
version: 1
sor: ciso-assistant
wrap: stay-out
lanes:
  - assessment: IdP
    pack_in: identity
    notes: BloodHound / PingCastle / HardeningKitty file_drop; Entra/Okta/Google users also in/saas/
  - assessment: MDM
    pack_in: wazuh
    notes: Fleet / osquery / Wazuh coverage file_drop; Intune/Jamf also in/mdm/ (host-wazuh alias)
  - assessment: cloud
    pack_in: cloud
    notes: Prowler / ScoutSuite / ASFF file_drop
  - assessment: DNS/email
    pack_in: dns_email
    notes: SPF/DKIM/DMARC/MX/cert Seen (Covey email_dns); missing DMARC is a control gap
  - assessment: DNS/email EASM
    pack_in: easm
    notes: Amass / Subfinder / httpx / WhatWeb file_drop
  - assessment: Covey
    pack_in: nmap
    notes: pack_drop assets.jsonl + findings.jsonl + meta.json + evidence/ (nmap + rustscan + httpx stdout-class)
  - assessment: VM
    pack_in: vuln
    notes: OpenVAS-class / Nuclei / Trivy / Nessus file_drop only
  - assessment: honeypot
    pack_in: honeypot
    notes: Palisade fleet-sensor stage 1|2 or Beelzebub pack_drop (session/cmd/login, stage null); deception-sensor evidence, not compromise
