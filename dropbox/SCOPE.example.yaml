# Copy to SCOPE.yaml after written client consent. Demo values are not a client estate.
client:
  name: "CLIENT LEGAL NAME"
consent:
  attestation_path: dropbox/consent/SIGNED-CONSENT.md
  attestation_sha256: "sha256-of-the-signed-attestation-file"
engagement:
  start: "YYYY-MM-DD"
  end: "YYYY-MM-DD"
internal:
  cidrs:
    - "10.0.0.0/8"
  hosts:
    - "dc01.client.internal"
external:
  hosts:
    - "vpn.client.example"
  domains:
    - "client.example"
  ips:
    - "192.0.2.10"
# Host-local only. nmap / nessus / nessuscli are opt-in under signed
# SCOPE.allow_tools — never a free-day live default.
allow_tools:
  - lynis
  - ss
  - ip
  - curl
  - testssl
orchestrator:
  # Brakes. Defaults prefer client-environment integrity over coverage ego.
  discover_prefix: 24
  deepen_batch: 3
  max_live_shards: 8
  max_workers: 2
  host_timeout_sec: 30
  stages:
    discover: true
    deepen: false
    external: false
  deepen_hosts: []
  stage_tools:
    discover:
      - nmap
    deepen:
      - nessus
      - nessuscli
byo: []
