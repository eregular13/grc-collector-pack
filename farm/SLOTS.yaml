# Private farm tool-zoo catalog. Binaries are NOT in this repo.
# Mapping form (not a list of maps) so yaml_lite can load it.
# license_class: use_dont_ship | commercial_byo | oss_byo
# scope_key: allow_tools (PATH invoke) | file_drop (operator lands files in in/)

private: true
hub_publish: false
vendored_binaries: false
scope_required: true

slots:
  nmap:
    id: nmap
    binary: nmap
    stage: discover
    category: discover
    scope_key: allow_tools
    sensor: nmap
    output_glob: in/nmap/*.gnmap
    license_class: use_dont_ship
    default_batch: 1
    wired: true
    hook: farm.adapters.nmap
    vendored: false
    source: host-PATH | bind-mount | private-tag
  rustscan:
    id: rustscan
    binary: rustscan
    stage: discover
    category: discover
    scope_key: file_drop
    sensor: nmap
    output_glob: in/nmap/*.xml
    license_class: oss_byo
    default_batch: 1
    wired: false
    hook: file-drop
    vendored: false
