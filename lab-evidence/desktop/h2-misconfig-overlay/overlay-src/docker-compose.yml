# LAB-ONLY overlay: deliberately misconfigured services. LAB/DEMO — not a client estate.
# internal network, no published ports. Scanner runs inside the same network.
name: misconfig
networks:
  misconfig_lab:
    internal: true
    ipam:
      config:
        - subnet: 172.31.250.0/24
x-lab: &lab
  restart: "no"
  labels:
    evergreen.lab: "misconfig"
    evergreen.honesty: "LAB/DEMO - not a client estate"
services:
  mc-ftp:
    <<: *lab
    build: ./ftp
    mem_limit: 32m
    networks: { misconfig_lab: { ipv4_address: 172.31.250.10 } }
  mc-redis:
    <<: *lab
    image: redis:7-alpine
    command: ["redis-server", "--protected-mode", "no", "--save", ""]
    mem_limit: 64m
    networks: { misconfig_lab: { ipv4_address: 172.31.250.11 } }
  mc-web:
    <<: *lab
    image: nginx:1.27-alpine
    environment:
      OPENSSL_CONF: /etc/nginx/openssl.cnf
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/openssl.cnf:/etc/nginx/openssl.cnf:ro
      - ./nginx/www:/srv/www:ro
      - ./nginx/tls:/etc/nginx/tls:ro
    mem_limit: 32m
    networks: { misconfig_lab: { ipv4_address: 172.31.250.12 } }
  mc-smb:
    <<: *lab
    build: ./samba
    mem_limit: 96m
    networks: { misconfig_lab: { ipv4_address: 172.31.250.13 } }
  mc-db:
    <<: *lab
    image: mariadb:11
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
    command: ["--innodb-buffer-pool-size=16M", "--performance-schema=OFF"]
    mem_limit: 192m
    networks: { misconfig_lab: { ipv4_address: 172.31.250.14 } }
  scan:
    # One-shot scanner confined to misconfig_lab (profile: not started by `up`).
    image: instrumentisto/nmap:7.95
    profiles: ["scan"]
    networks: { misconfig_lab: { ipv4_address: 172.31.250.250 } }
    volumes: [ "./out:/out" ]
    command: >
      -n -Pn -sT -sV -p 21,80,443,445,3306,6379
      --script ftp-anon,ssl-enum-ciphers,ssl-cert,smb2-security-mode,smb-security-mode,redis-info,http-enum,http-title,mysql-empty-password,http-default-accounts
      -oX /out/misconfig-nse.xml 172.31.250.10-14
    mem_limit: 128m
