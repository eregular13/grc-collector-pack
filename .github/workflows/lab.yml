name: lab

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lab:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      OUT_DIR: ${{ github.workspace }}/out
      DRY_RUN: "1"
      GRC_LIVE_SCAN: "0"
      CISO_PUSH: "0"
      RISKREADY_PUSH: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Pytest
        run: python -m pytest tests -q
      - name: SAMPLE keep-lab dry-run
        run: bash scripts/sample_to_sor.sh --pack-in "${{ github.workspace }}/in" --work "${{ runner.temp }}/keep-work"
      - name: Farm pack_drop → CISO dry-run
        run: |
          set -euo pipefail
          work="${{ runner.temp }}/prove-work"
          bash scripts/farm_drop_to_sor.sh --work "$work"
          python - "$work" <<'PY'
          import json
          import sys
          from pathlib import Path

          from shared.ciso_shape import CISO_HEADERS, POAM_HEADER, assert_risk_register_and_poam

          work = Path(sys.argv[1])
          stamp = json.loads((work / "prove-ciso.json").read_text(encoding="utf-8"))
          assert stamp.get("sample") is True, stamp
          assert stamp.get("client") is False, stamp
          assert stamp.get("paying_day") == "FAIL", stamp
          assert stamp.get("posted") is False, stamp
          shape = assert_risk_register_and_poam(work / "out")
          assert shape["findings"] >= 1, shape
          assert shape["risk_scenarios"] >= shape["findings"], shape
          assert shape["poam_rows"] >= 1, shape
          assert stamp["counts"]["poam"] == shape["poam_rows"], (stamp["counts"], shape)
          assert shape["vulnerabilities"] == 0, "farm_drop pack_drop is exposure, not CVE-class"
          ciso = work / "out" / "ciso-assistant"
          for name in (
              "assets.csv",
              "findings.csv",
              "vulnerabilities.csv",
              "applied_controls.csv",
              "risk_scenarios.csv",
          ):
              first = (ciso / name).read_text(encoding="utf-8").splitlines()[0].strip()
              assert first == CISO_HEADERS[name], (name, first)
          poam = (work / "out" / "poam" / "poam.csv").read_text(encoding="utf-8")
          assert poam.splitlines()[0].strip() == POAM_HEADER
          assert (work / "out" / "poam" / "poam.md").is_file()
          print(
              f"farm_drop register ok; findings={shape['findings']} "
              f"risk_scenarios={shape['risk_scenarios']} poam_rows={shape['poam_rows']} "
              f"vulns={shape['vulnerabilities']}"
          )
          PY
      - name: Collectors and loader
        run: |
          python collectors/cloud_prowler.py
          python collectors/inventory_nmap.py
          python collectors/vuln_scan.py
          python collectors/host_wazuh.py
          python collectors/identity_ad.py
          python collectors/easm.py
          python collectors/k8s_kubescape.py
          python collectors/code_secrets.py
          python collectors/saas_idp.py
          python collectors/dns_email.py
          python collectors/grc_loader.py
      - name: Lab outputs
        run: python tests/lab_outputs.py

  # Clean-checkout cold SAMPLE→SoR. Full git clone (keep/__main__.py present).
  # No Docker — keep-lab is file-drop only. Honesty-only; not a paying_day PASS.
  sample-to-sor-cold:
    name: cold SAMPLE→SoR
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      DRY_RUN: "1"
      GRC_LIVE_SCAN: "0"
      CISO_PUSH: "0"
      RISKREADY_PUSH: "0"
      DROPBOX_LIVE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Preflight keep package (full clone)
        run: |
          test -f keep/__main__.py
          test -f keep/lab.py
          test -f keep/adapters.py
      - name: Cold SAMPLE→SoR
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/sample-to-sor-cold"
          ./scripts/sample_to_sor.sh --work "$work"
          python - "$work" <<'PY'
          import json
          import sys
          from pathlib import Path

          from shared.ciso_shape import CISO_HEADERS, POAM_HEADER, assert_risk_register_and_poam

          work = Path(sys.argv[1])
          ciso = work / "out" / "ciso-assistant"
          doc = json.loads((ciso / "IMPORT.json").read_text(encoding="utf-8"))
          assert doc.get("demo") is True, doc
          assert doc.get("sample") is True, doc
          assert doc.get("client_keep") is False, doc
          assert doc.get("paying_day") == "FAIL", doc
          assert doc.get("posted") is False, doc
          shape = assert_risk_register_and_poam(work / "out")
          assert shape["findings"] >= 1, shape
          assert shape["risk_scenarios"] >= shape["findings"], shape
          assert shape["poam_rows"] >= 1, shape
          assert shape["vulnerabilities"] >= 1, shape
          for name, header in CISO_HEADERS.items():
              path = ciso / name
              if not path.is_file():
                  continue
              first = path.read_text(encoding="utf-8").splitlines()[0].strip()
              assert first == header, (name, first)
          poam = (work / "out" / "poam" / "poam.csv").read_text(encoding="utf-8")
          assert poam.splitlines()[0].strip() == POAM_HEADER
          print(
              f"IMPORT.json honesty ok; findings={shape['findings']} "
              f"risk_scenarios={shape['risk_scenarios']} "
              f"poam_rows={shape['poam_rows']} vulns={shape['vulnerabilities']}"
          )
          PY
      - name: Cold SAMPLE→SoR with exporters
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/sample-to-sor-cold-exporters"
          ./scripts/sample_to_sor.sh --work "$work" --exporters
          python - "$work" <<'PY'
          import json
          import sys
          from pathlib import Path

          from shared.ciso_shape import assert_risk_register_and_poam

          work = Path(sys.argv[1])
          ciso = work / "out" / "ciso-assistant"
          doc = json.loads((ciso / "IMPORT.json").read_text(encoding="utf-8"))
          assert doc.get("demo") is True and doc.get("sample") is True, doc
          assert doc.get("client_keep") is False, doc
          assert doc.get("paying_day") == "FAIL", doc
          assert doc.get("posted") is False, doc
          shape = assert_risk_register_and_poam(work / "out")
          assert shape["findings"] >= 1 and shape["poam_rows"] >= 1, shape
          assert (work / "out" / "opengrc" / "risks.csv").is_file()
          assert (work / "out" / "import_preview" / "probo.json").is_file()
          print(f"exporters honesty ok; findings={shape['findings']} poam_rows={shape['poam_rows']}")
          PY
