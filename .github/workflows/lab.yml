name: lab

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      DRY_RUN: "1"
      CISO_PUSH: "0"
      RISKREADY_PUSH: "0"
      GRC_LIVE_SCAN: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Pytest (no Docker estate required)
        run: python -m pytest tests -q
