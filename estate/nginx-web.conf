server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Dummy lab Git metadata. Not a nested git repo. Not a client LAN.
    location /.git/ {
        alias /usr/share/nginx/html/git-meta/;
        default_type text/plain;
    }

    # Dummy lab autoindex on a subpath only. Root still serves index.html.
    location /listing/ {
        autoindex on;
        autoindex_exact_size off;
    }
}
