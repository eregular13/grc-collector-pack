server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Dummy lab Git metadata. Not a nested git repo. Not a client LAN.
    location /.git/ {
        alias /usr/share/nginx/html/git-meta/;
        default_type text/plain;
    }

    # Dummy lab .env. Values already [REDACTED]. Not a nested .env gitignore trap.
    location = /.env {
        alias /usr/share/nginx/html/env-meta/lab.env;
        default_type text/plain;
    }

    # Dummy lab autoindex on a subpath only. Root still serves index.html.
    location /listing/ {
        autoindex on;
        autoindex_exact_size off;
    }

    # Dummy lab insecure session cookie on a stub only. Root HEAD has no Set-Cookie.
    location = /cookie {
        add_header Set-Cookie "session=labonly; Path=/" always;
        default_type text/plain;
        return 200 "lab cookie stub. not a client LAN.\n";
    }

    # Dummy lab permissive CORS on a stub only. Root HEAD has no ACAO.
    location = /cors {
        add_header Access-Control-Allow-Origin * always;
        default_type text/plain;
        return 200 "lab cors stub. not a client LAN.\n";
    }
}
